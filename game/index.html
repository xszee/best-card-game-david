<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember Duel — a 1v1 card battler</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main id="table" aria-label="Ember Duel: a 1v1 card duel against Cinder, the Ash Warden">
  <header class="topbar">
    <h1>EMBER DUEL</h1>
    <p id="turn-line" role="status">Loading the table…</p>
  </header>

  <section class="side foe" aria-label="Opponent">
    <div class="hero-line">
      <span id="foe-hp" class="hp"></span>
      <span id="foe-mana" class="mana"></span>
    </div>
    <div id="foe-hand" class="mini-hand" aria-label="Opponent hand"></div>
    <div id="foe-board" class="board" aria-label="Opponent creatures"></div>
  </section>

  <section class="middle">
    <div id="log" class="log" aria-live="polite"></div>
    <button id="end-turn" type="button">End Turn</button>
  </section>

  <section class="side you" aria-label="Your side">
    <div id="you-board" class="board" aria-label="Your creatures"></div>
    <div id="you-hand" class="hand" aria-label="Your hand"></div>
    <div class="hero-line">
      <span id="you-hp" class="hp"></span>
      <span id="you-mana" class="mana"></span>
    </div>
  </section>

  <div id="overlay" class="overlay hidden">
    <div class="panel">
      <h2 id="overlay-title"></h2>
      <p id="overlay-text"></p>
      <button id="overlay-btn" type="button"></button>
      <p class="hint">Click a glowing card to play it · End Turn to attack · P pauses · Space confirms</p>
    </div>
  </div>
</main>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
